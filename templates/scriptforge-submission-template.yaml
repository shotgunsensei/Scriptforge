title: Collect Windows System Inventory
slug: collect-windows-system-inventory
version: 1.0.0
category: endpoint
subcategory: inventory
tags:
  - powershell
  - windows
  - inventory
author:
  name: OperatorOS ScriptForge
  email: scripts@operatoros.net
  organization: Shotgun Ninjas Productions
summary: Collects basic Windows hardware, OS, and network inventory details.
description: A safe baseline inventory script intended for technician review and controlled execution from OperatorOS ScriptForge.
use_case: Use during endpoint triage to capture basic local system facts before deeper troubleshooting.
safety:
  risk_level: low
  scan_required: true
  scan_status: not_scanned
  risk_flags: []
  requires_admin: false
  touches_network: false
  touches_registry: false
  touches_filesystem: false
  notes: Read-only inventory example. Must still pass ScriptForge safety scanning before approval.
requirements:
  - name: PowerShell 5.1 or newer
    description: Runs on supported Windows PowerShell or PowerShell versions.
    required: true
parameters:
  - name: IncludeNetwork
    type: boolean
    description: Include network adapter details in the output.
    required: false
    default: true
    sensitive: false
examples:
  - title: Run local inventory
    command: .\Collect-WindowsSystemInventory.ps1 -IncludeNetwork $true
    description: Runs the inventory script with network details enabled.
output:
  format: json
  description: Returns system inventory facts as JSON.
  sample: '{"computerName":"WORKSTATION-01","os":"Windows 11"}'
script_body: |
  param([bool]$IncludeNetwork = $true)
  $inventory = [ordered]@{
    computerName = $env:COMPUTERNAME
    os = (Get-CimInstance Win32_OperatingSystem).Caption
    serialNumber = (Get-CimInstance Win32_BIOS).SerialNumber
  }
  if ($IncludeNetwork) {
    $inventory.networkAdapters = Get-CimInstance Win32_NetworkAdapterConfiguration | Where-Object { $_.IPEnabled } | Select-Object Description,IPAddress,MACAddress
  }
  $inventory | ConvertTo-Json -Depth 4
